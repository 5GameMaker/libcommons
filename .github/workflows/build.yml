name: Build and test libcommons
on: push
permissions:
  contents: read
jobs:
  # Should I even bother supporting x32?

  x86_64_linux_unknown_gnu:
    name: Test on x86_64-linux-unknown-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: x86_64-unknown-linux-gnu
          toolchain: nightly
      - run: cargo test --target=x86_64-unknown-linux-gnu
      - run: cargo test --target=x86_64-unknown-linux-gnu --features=full
      - run: cargo test --target=x86_64-unknown-linux-gnu --features=full-nightly
  x86_64_linux_unknown_musl:
    name: Test on x86_64-linux-unknown-musl
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y musl-tools
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: x86_64-unknown-linux-musl
          toolchain: nightly
      - run: cargo test --target=x86_64-unknown-linux-musl
      - run: cargo test --target=x86_64-unknown-linux-musl --features=full
      - run: cargo test --target=x86_64-unknown-linux-musl --features=full-nightly
  x86_64_pc-windows-msvc:
    name: Test on x86_64_pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: x86_64-pc-windows-msvc
          toolchain: nightly
      - run: cargo test --target=x86_64-pc-windows-msvc
      - run: cargo test --target=x86_64-pc-windows-msvc --features=full
      - run: cargo test --target=x86_64-pc-windows-msvc --features=full-nightly

  aarch64-unknown-linux-gnu:
    name: Test on aarch64-unknown-linux-gnu
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-unknown-linux-gnu
          toolchain: nightly
      - run: cargo test --target=aarch64-unknown-linux-gnu
      - run: cargo test --target=aarch64-unknown-linux-gnu --features=full
      - run: cargo test --target=aarch64-unknown-linux-gnu --features=full-nightly
  aarch64-unknown-linux-musl:
    name: Test on aarch64-unknown-linux-musl
    runs-on: ubuntu-26.04-arm
    steps:
      - run: sudo apt-get install -y musl-tools
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-unknown-linux-musl
          toolchain: nightly
      - run: cargo test --target=aarch64-unknown-linux-musl
      - run: cargo test --target=aarch64-unknown-linux-musl --features=full
      - run: cargo test --target=aarch64-unknown-linux-musl --features=full-nightly
  aarch64-pc-windows-gnullvm:
    name: Test on aarch64-pc-windows-gnullvm
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-pc-windows-gnullvm
          toolchain: nightly
      - run: cargo test --target=aarch64-pc-windows-gnullvm
      - run: cargo test --target=aarch64-pc-windows-gnullvm --features=full
      - run: cargo test --target=aarch64-pc-windows-gnullvm --features=full-nightly
  aarch64-pc-windows-msvc:
    name: Test on aarch64-pc-windows-msvc
    runs-on: windows-11-vs2026-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-pc-windows-msvc
          toolchain: nightly
      - run: cargo test --target=aarch64-pc-windows-msvc
      - run: cargo test --target=aarch64-pc-windows-msvc --features=full
      - run: cargo test --target=aarch64-pc-windows-msvc --features=full-nightly

  aarch64-apple-darwin:
    name: Test on aarch64-apple-darwin
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: aarch64-apple-darwin
          toolchain: nightly
      - run: cargo test --target=aarch64-apple-darwin
      - run: cargo test --target=aarch64-apple-darwin --features=full
      - run: cargo test --target=aarch64-apple-darwin --features=full-nightly
  x86_64-apple-darwin:
    name: Test on x86_64-apple-darwin
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: x86_64-apple-darwin
          toolchain: nightly
      - run: cargo test --target=x86_64-apple-darwin
      - run: cargo test --target=x86_64-apple-darwin --features=full
      - run: cargo test --target=x86_64-apple-darwin --features=full-nightly

