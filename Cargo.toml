[package]
name = "libcommons"
description = "A bunch of things I don't want to write again"
version = "0.8.0"
edition = "2024"
readme = false
repository = "https://github.com/5GameMaker/libcommons"
license = "MIT"
keywords = ["common", "ffi"]
categories = ["development-tools::ffi"]

[features]
default = []

full = ["args", "str", "dirs", "extra_traits", "io", "result", "iter", "ffi", "validity", "meta", "dl"]
args = []
dirs = []
dl = ["ffi"]
extra_traits = []
ffi = ["dep:libc"]
io = []
iter = []
str = []
meta = []
result = []
validity = []

full-nightly = ["full"]
nightly = []
matrix = ["nightly"]

[target.'cfg(unix)'.dependencies]
libc = { version = "*", optional = true }
